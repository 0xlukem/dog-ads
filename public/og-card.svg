<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DOG. FUR. ADS. CONE.</title>
  <desc id="desc">Chon wears a medical cone with advertising space, surrounded by playful campaign marks.</desc>
  <defs>
    <clipPath id="dog-crop"><circle cx="895" cy="315" r="225"/></clipPath>
    <filter id="og-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#242321" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f5f0e7"/>
  <path d="M0 546h1200" stroke="#d8cec0" stroke-width="2"/>
  <g fill="#d5673f" font-family="DM Mono, monospace" font-size="18" font-weight="500" letter-spacing="5">
    <text x="68" y="78">CHON HAS SPACE</text>
    <text x="68" y="578">CANINE ADVERTISING / ARGENTINA</text>
  </g>
  <g fill="#242321" font-family="Arial Black, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-6">
