<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e7" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Perdón, Chon hizo pis en el servidor y lo rompió." />
    <link rel="icon" type="image/svg+xml" href="/favicon-dog.svg" />
    <title>Chon rompió el servidor — 404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color: #242321; background: #f5f0e7; font-family: 'Space Grotesk', sans-serif; --paper: #f5f0e7; --ink: #242321; --muted: #756e64; --line: rgba(36,35,33,.2); --accent: #d5673f; --accent-dark: #a84229; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; background: var(--paper); }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; cursor: pointer; }
      :where(a,button):focus-visible { outline: 3px solid #274d43; outline-offset: 4px; }
      .page { width: min(1320px, calc(100% - 56px)); min-height: 100vh; margin: 0 auto; padding: 24px 0 48px; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: inline-flex; align-items: center; gap: 9px; font: 500 15px 'DM Mono', monospace; letter-spacing: .08em; }
      .brand img { width: 25px; height: 25px; }
      .language-toggle { display: inline-flex; width: clamp(102px, 10vw, 160px); border: 1px solid rgba(36,35,33,.28); border-radius: 5px; padding: 6px; }
      .language-toggle button { flex: 1; min-height: 43px; border: 0; border-radius: 3px; color: var(--muted); background: transparent; font: 500 12px 'DM Mono', monospace; }
      .language-toggle button[aria-pressed="true"] { color: #2d211b; background: var(--accent); }
      main { flex: 1; display: grid; align-items: center; padding: 70px 0 40px; }
      .content { display: grid; grid-template-columns: minmax(0, .8fr) minmax(420px, 1.2fr); align-items: center; gap: clamp(36px, 7vw, 110px); }
      h1 { max-width: 580px; margin: 0; color: var(--ink); font-size: clamp(3rem, 6vw, 5.6rem); line-height: .9; letter-spacing: -.075em; }
      .not-found-message { max-width: 500px; margin: 24px 0 0; color: var(--muted); font-size: clamp(1.05rem, 1.7vw, 1.35rem); line-height: 1.45; }
      .not-found-message strong, .not-found-message span { display: block; }
      .not-found-message strong { color: var(--ink); font-weight: 600; }
      .not-found-message span { margin-top: 8px; }
      .home-link { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; margin-top: 32px; padding: 0 22px; color: #2d211b; background: var(--accent); font-weight: 700; transition: background .2s ease, transform .2s ease; }
      .home-link:hover { background: #e17950; transform: translateY(-2px); }
      .illustration { position: relative; width: 100%; max-width: 660px; justify-self: end; }
      .illustration__scene { display: block; width: 100%; height: auto; }
      footer { color: var(--muted); font: 11px 'DM Mono', monospace; }
      @media (max-width: 820px) { .page { width: min(calc(100% - 32px), 620px); padding-top: 18px; } main { padding-top: 52px; } .content { grid-template-columns: 1fr; gap: 42px; } .illustration { max-width: 600px; justify-self: start; order: -1; } h1 { font-size: clamp(3.3rem, 14vw, 5.7rem); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="Chon has space"><img src="/favicon-dog.svg" alt="" /> CHON</a>
        <div class="language-toggle" role="group" data-i18n-aria="language.group">
          <button type="button" data-language="es" aria-pressed="true">ES</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </header>
      <main>
        <div class="content">
          <section>
            <h1 data-i18n="notFound.error">ERROR 404</h1>
            <p class="not-found-message"><strong data-i18n="notFound.title">Perdón, Chon hizo pis en el servidor y lo rompió.</strong><span data-i18n="notFound.body">El servidor quedó hecho un desastre. Volvé al inicio y fingimos que esto nunca pasó.</span></p>
            <a class="home-link" href="/" data-i18n="notFound.cta">Volver al inicio</a>
          </section>
          <div class="illustration"><img class="illustration__scene" src="/assets/chon-404.svg" data-i18n-alt="notFound.imageAlt" alt="Un rack de servidor roto arde por dentro y por arriba, larga rayos eléctricos y tiene un charco amarillo a un costado." /></div>
        </div>
      </main>
      <footer data-i18n="notFound.footer">Chon agradece tu paciencia.</footer>
    </div>
    <script>
      (() => {
        const copy = {
          es: { notFound: { error: 'ERROR 404', title: 'Perdón, Chon hizo pis en el servidor y lo rompió.', body: 'El servidor quedó hecho un desastre. Volvé al inicio y fingimos que esto nunca pasó.', cta: 'Volver al inicio', imageAlt: 'Un rack de servidor roto arde por dentro y por arriba, larga rayos eléctricos y tiene un charco amarillo a un costado.', footer: 'Chon agradece tu paciencia.' }, description: 'Perdón, Chon hizo pis en el servidor y lo rompió.', language: { group: 'Selector de idioma' } },
          en: { notFound: { error: 'ERROR 404', title: 'Sorry, Chon peed on the server and broke it.', body: 'The server is a complete mess. Go back home and we will pretend this never happened.', cta: 'Back to home', imageAlt: 'A broken server rack burns inside and on top, emits electrical arcs, and has a yellow puddle off to one side.', footer: 'Chon appreciates your patience.' }, description: 'Sorry, Chon peed on the server and broke it.', language: { group: 'Language selector' } },
        };
        const stored = window.localStorage.getItem('chon-language');
        let language = stored === 'en' || stored === 'es' ? stored : (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'es';
        const setLanguage = (next) => {
          language = next;
          window.localStorage.setItem('chon-language', next);
          const strings = copy[next];
          document.documentElement.lang = next;
          document.title = next === 'en' ? 'Chon broke the server — 404' : 'Chon rompió el servidor — 404';
          document.querySelector('meta[name="description"]').content = strings.description;
          document.querySelectorAll('[data-i18n]').forEach((node) => { const key = node.dataset.i18n.split('.').reduce((value, part) => value && value[part], strings); if (key) node.textContent = key; });
          document.querySelectorAll('[data-i18n-alt]').forEach((node) => { const key = node.dataset.i18nAlt.split('.').reduce((value, part) => value && value[part], strings); if (key) node.alt = key; });
          document.querySelectorAll('[data-i18n-aria]').forEach((node) => { const key = node.dataset.i18nAria.split('.').reduce((value, part) => value && value[part], strings); if (key) node.setAttribute('aria-label', key); });
          document.querySelectorAll('[data-language]').forEach((button) => { button.setAttribute('aria-pressed', String(button.dataset.language === next)); });
        };
        document.querySelectorAll('[data-language]').forEach((button) => button.addEventListener('click', () => setLanguage(button.dataset.language)));
        setLanguage(language);
      })();
    </script>
  </body>
</html>
